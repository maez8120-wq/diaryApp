<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>diary · little moments</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(145deg, #f9f3e9 0%, #f2e9de 100%);
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }

  /* ---------- AUTH SCREEN ---------- */
  #auth-screen {
    max-width: 420px;
    width: 100%;
    background: #fffcf8;
    border-radius: 24px;
    padding: 2.2rem 2rem;
    box-shadow: 0 12px 40px rgba(80, 60, 40, 0.15), 0 0 0 1px #efe5db;
  }

  #auth-screen h2 {
    font-weight: 500;
    font-size: 1.6rem;
    color: #4d3e32;
    margin-bottom: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  #auth-screen p.subtitle {
    color: #8b7a6b;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  #auth-screen input {
    width: 100%;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.9rem;
    border: 1px solid #e2d6cb;
    background: #ffffffec;
    border-radius: 1rem;
    font-size: 1rem;
    font-family: inherit;
    color: #2d241e;
    outline: none;
    transition: 0.2s;
  }

  #auth-screen input:focus {
    border-color: #baa28e;
    box-shadow: 0 0 0 4px rgba(200, 170, 150, 0.15);
  }

  .auth-btn {
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 1rem;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }

  .auth-btn.primary {
    background: #6e5a4b;
    color: white;
    margin-bottom: 0.6rem;
    box-shadow: 0 6px 14px -4px rgba(80, 60, 40, 0.3);
  }

  .auth-btn.primary:hover { background: #5e4c3e; transform: translateY(-1px); }

  .auth-btn.secondary {
    background: #f2e6dd;
    color: #4d3e32;
  }

  .auth-btn.secondary:hover { background: #eaddd1; }

  #authMsg {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #b35e4e;
    min-height: 1.2em;
    text-align: center;
  }

  /* ---------- DIARY APP ---------- */
  .diary-app {
    max-width: 1100px;
    width: 100%;
    background: rgba(255, 251, 245, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 2.5rem;
    box-shadow:
      0 20px 40px -12px rgba(0, 0, 0, 0.2),
      inset 0 1px 4px rgba(255, 255, 255, 0.8),
      0 0 0 1px rgba(230, 210, 190, 0.3);
    padding: 2rem;
  }

  .diary-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px dashed #ddcfc0;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .diary-header h1 {
    font-weight: 400;
    font-size: 2rem;
    letter-spacing: -0.5px;
    color: #4d3e32;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .entry-count {
    background: #e7dbce;
    color: #4d3e32;
    padding: 0.3rem 0.9rem;
    border-radius: 40px;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .logout-btn {
    background: #fff;
    border: 1px solid #e6d9cf;
    color: #6b5a4b;
    padding: 0.4rem 0.9rem;
    border-radius: 30px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }

  .logout-btn:hover { background: #f2e6dd; }

  .diary-main {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 2rem;
    align-items: start;
  }

  /* Write panel */
  .write-panel {
    background: #fefcf9;
    border-radius: 2rem;
    padding: 1.8rem 1.6rem;
    box-shadow: 0 8px 18px -6px rgba(80, 60, 40, 0.12), inset 0 1px 0 #fff, 0 0 0 1px #efe5db;
  }

  .write-panel h2 {
    font-size: 1.35rem;
    font-weight: 500;
    color: #5b4a3b;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .date-display {
    font-size: 0.9rem;
    color: #8b7a6b;
    margin-bottom: 1.4rem;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dotted #d9cdc0;
    padding-bottom: 0.5rem;
  }

  .input-group { margin-bottom: 1.2rem; }

  .input-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: #6b5a4b;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .input-group input,
  .input-group textarea {
    width: 100%;
    border: 1px solid #e2d6cb;
    background: #ffffffec;
    border-radius: 1.2rem;
    padding: 0.9rem 1.2rem;
    font-family: inherit;
    font-size: 1rem;
    color: #2d241e;
    outline: none;
    transition: 0.2s;
    resize: vertical;
  }

  .input-group textarea { min-height: 150px; line-height: 1.5; }

  .input-group input:focus,
  .input-group textarea:focus {
    border-color: #baa28e;
    box-shadow: 0 0 0 4px rgba(200, 170, 150, 0.15);
    background: #fffdfb;
  }

  .button-row { display: flex; gap: 0.8rem; margin-top: 1.6rem; flex-wrap: wrap; }

  .btn {
    border: none;
    border-radius: 3rem;
    padding: 0.85rem 1.8rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: 0.15s;
    background: #fff7f0;
    color: #4e3e30;
    box-shadow: 0 3px 8px rgba(140, 110, 90, 0.1), 0 0 0 1px #e6d9cf;
    flex: 1 0 auto;
  }

  .btn-primary {
    background: #6e5a4b;
    color: white;
    box-shadow: 0 8px 16px -6px rgba(80, 60, 40, 0.3), 0 0 0 1px #5e4c3e;
  }

  .btn-primary:hover { background: #5e4c3e; transform: translateY(-1px); }
  .btn-secondary:hover { background: #f2e6dd; }
  .btn:active { transform: scale(0.97); }

  /* Entries panel */
  .entries-panel {
    background: #fefcf9;
    border-radius: 2rem;
    padding: 1.4rem 1.4rem 1rem;
    box-shadow: 0 8px 18px -6px rgba(80, 60, 40, 0.12), inset 0 1px 0 #fff, 0 0 0 1px #efe5db;
    display: flex;
    flex-direction: column;
    max-height: 640px;
    min-height: 420px;
  }

  .entries-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0 0.4rem 0.6rem;
    border-bottom: 1px solid #ecdfd5;
  }

  .entries-header h3 {
    font-weight: 500;
    font-size: 1.2rem;
    color: #5b4a3b;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .clear-btn {
    background: none;
    border: none;
    font-size: 0.8rem;
    color: #aa8f7c;
    cursor: pointer;
    padding: 0.3rem 0.7rem;
    border-radius: 30px;
    font-weight: 500;
    text-decoration: underline dotted;
    text-underline-offset: 4px;
    font-family: inherit;
  }

  .clear-btn:hover { color: #a5524a; background: #f9ece4; }

  .entries-list {
    overflow-y: auto;
    flex: 1;
    padding-right: 0.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .entries-list::-webkit-scrollbar { width: 6px; }
  .entries-list::-webkit-scrollbar-track { background: #f3e9e1; border-radius: 10px; }
  .entries-list::-webkit-scrollbar-thumb { background: #d9c7ba; border-radius: 10px; }

  .entry-card {
    background: #fffcf8;
    border-radius: 1.6rem;
    padding: 1.2rem 1.3rem 1rem;
    box-shadow: 0 2px 10px rgba(180, 150, 130, 0.08), 0 0 0 1px #f0e6de;
    border-left: 5px solid #d9c2b0;
    animation: fadeSlide 0.25s ease-out;
    word-break: break-word;
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .entry-card:hover {
    box-shadow: 0 6px 16px rgba(160, 130, 110, 0.12), 0 0 0 1px #e3d5ca;
    background: #fffdfb;
  }

  .entry-title {
    font-weight: 600;
    font-size: 1.1rem;
    color: #4b392b;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .entry-title span:first-child { flex: 1; word-break: break-word; }

  .entry-title-right { display: flex; align-items: center; gap: 8px; }

  .entry-date {
    font-size: 0.7rem;
    font-weight: 400;
    color: #a08e7e;
    background: #f3ebe4;
    padding: 0.2rem 0.7rem;
    border-radius: 30px;
    white-space: nowrap;
  }

  .entry-content {
    font-size: 0.92rem;
    color: #55473b;
    line-height: 1.5;
    white-space: pre-wrap;
    margin-top: 0.6rem;
    border-top: 1px dashed #ecdfd5;
    padding-top: 0.7rem;
    max-height: 180px;
    overflow-y: auto;
  }

  .delete-entry {
    background: transparent;
    border: none;
    color: #b8a294;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: 0.1s;
  }

  .delete-entry:hover {
    color: #b35e4e;
    background: #fbefe9;
    opacity: 1;
    transform: scale(1.1);
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #bba998;
    font-style: italic;
    padding: 2.5rem 1rem;
    text-align: center;
    gap: 0.5rem;
  }

  .empty-state span { font-size: 2.5rem; opacity: 0.6; }

  .hidden { display: none !important; }

  @media (max-width: 750px) {
    .diary-main { grid-template-columns: 1fr; gap: 1.5rem; }
    .diary-app { padding: 1.5rem; border-radius: 2rem; }
    .diary-header h1 { font-size: 1.6rem; }
    .entries-panel { max-height: 520px; }
  }

  @media (max-width: 480px) {
    body { padding: 0.8rem; }
    .diary-app { padding: 1.2rem; }
    .write-panel { padding: 1.4rem; }
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <h2>📖 dear diary</h2>
  <p class="subtitle">sign in to unlock your private journal</p>
  <input type="email" id="email" placeholder="email" autocomplete="email" />
  <input type="password" id="password" placeholder="password (min 6 chars)" autocomplete="current-password" />
  <button class="auth-btn primary" id="loginBtn">Log in</button>
  <button class="auth-btn secondary" id="signupBtn">Create account</button>
  <p id="authMsg"></p>
</div>

<!-- DIARY APP -->
<div class="diary-app hidden" id="diary-app">
  <div class="diary-header">
    <h1><span>📖</span> dear diary</h1>
    <div class="header-right">
      <div class="entry-count" id="entryCount">0 entries</div>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="diary-main">
    <!-- Write panel -->
    <div class="write-panel">
      <h2><span>✍️</span> new entry</h2>
      <div class="date-display">
        <span id="currentDate"></span>
        <span>🌿</span>
      </div>
      <div class="input-group">
        <label for="entryTitle">title</label>
        <input type="text" id="entryTitle" placeholder="e.g. A quiet morning..." maxlength="80" />
      </div>
      <div class="input-group">
        <label for="entryContent">what's on your mind?</label>
        <textarea id="entryContent" placeholder="Write freely..."></textarea>
      </div>
      <div class="button-row">
        <button class="btn btn-primary" id="saveBtn"><span>💾</span> save entry</button>
        <button class="btn btn-secondary" id="clearFormBtn"><span>🧹</span> clear</button>
      </div>
    </div>

    <!-- Entries panel -->
    <div class="entries-panel">
      <div class="entries-header">
        <h3><span>📚</span> past entries</h3>
        <button class="clear-btn" id="clearAllBtn">clear all</button>
      </div>
      <div class="entries-list" id="entriesList">
        <div class="empty-state" id="emptyState">
          <span>🕊️</span>
          no entries yet — write your first thought
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
